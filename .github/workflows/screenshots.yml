name: Emulator screenshots

# Launches the app on an Android emulator with sample notes and uploads screenshots
# as an artifact. Doubles as a smoke test that the app starts and its screens open.
on:
  push:
    branches: [main]
    paths: ['app/src/main/**', 'scripts/screenshots.sh', '.github/workflows/screenshots.yml']
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/screenshots.sh
      # Also emit the images as base64 in the log, for tools that can read logs but not artifacts.
      - name: Screenshot data (base64)
        if: always()
        run: |
          for f in docs/screenshots/*.png; do
            echo "::group::$f"
            echo "BEGIN $(basename "$f")"; base64 -w 120 "$f"; echo "END $(basename "$f")"
            echo "::endgroup::"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/screenshots
            debug
          if-no-files-found: ignore
